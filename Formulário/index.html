<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Academia</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<h1>Cadastro de Alunos</h1>
<body>
    
    <form id = "formAcademia" class="formulario">
    
    <label>Nome Completo:</label>
<input type="text" id="nome" required>
    
<label>CPF:</label>
<input type="text" id="cpf" required>

<label>Data de Nascimento:</label>
<input type="date" id="nascimento" required>
<br><br>
<label>Sexo:</label>
<select id="sexo" required>
    <option value="">Selecione</option>
    <option value="Feminino">Feminino</option>
    <option value="Masculino">Masculino</option>
    <option value="Outro">Outro</option>
</select>

<label>E-mail:</label>
    <input type="email" id="email" required>

 <label>Telefone:</label>
     <input type="tel" id="telefone" required>

<label>Endereço:</label>
     <input type="text" id="endereco" required>
<br><br>
     <label>Objetivo do seu treino:</label>
     <select id="objetivo" required>
        <option value="">Selecione</option>
        <option value="Emagrecimento">Emagrecimento</option>
        <option value="Hipertrofia">Hipertrofia</option>
        <option value="Condicionamento">Condicionamento físico</option>
    </select>

    <label>Plano da academia:</label>
        <select id="plano" required>
            <option value="">Selecione</option>
            <option value="Mensal">Mensal</option>
            <option value="Trimestral">Trimestral</option>
            <option value="Semestral">Semestral</option>
            <option value="Anual">Anual</option>
        </select>

        <label>Data de início:</label>
        <input type="date" id="inicio" required>
<br><br>
        <button type="submit" id="cadastro">Cadastrar</button>
</form>
</body>
</html>
